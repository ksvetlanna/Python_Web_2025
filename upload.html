<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Загружаем файл</title>
</head>
<body>
<h1>Файл под загрузку</h1>
<form method="post" enctype="multipart/form-data">      <!--enctype="multipart/form-data" - что бы вместо запроса не пошло имя файла-->
  <input type="file" name="file">        <!--загрузка файла-->
  <input type="submit">                  <!--загрузка файла-->
</form>

</body>
</html>
