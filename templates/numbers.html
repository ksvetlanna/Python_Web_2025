<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>
<body>
{% if number %}
        {% if number % 2 == 0 %} <!--в % обозначаются условия и циклы-->
            <p>Число {{number}} четное!</p>
    {% else %}
            <p>Число {{number}} нечетное!</p>
    {% endif %}
{% else %}
<p>Число {{number}} нечетное!</p>
{% endif %}
</body>
</html>
